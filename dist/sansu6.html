:root{
  --ink:#4d4270;--ink2:#8a7aa8;--white:#fffdfb;
  --lav:#b9a6f2;--lav2:#e6defd;--mint:#8fdcc0;--mint2:#d6f5ea;--pink:#ffadcf;--pink2:#ffe3ee;
  --sky:#9fd3ff;--sky2:#ddf0ff;--lemon:#ffe08a;--lemon2:#fff4cc;--peach:#ffc2a3;
  --glass:rgba(255,253,251,.94);
  --shadow:0 6px 0 rgba(60,40,120,.25),0 14px 30px rgba(20,10,60,.35);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#1d1838;font-family:"ZMG","Zen Maru Gothic","BIZ UDPGothic","Yu Gothic UI",sans-serif;font-weight:700;color:var(--ink);user-select:none;-webkit-user-select:none}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;
  background:radial-gradient(ellipse at 20% 10%,#4b3f8f 0%,rgba(75,63,143,0) 55%),radial-gradient(ellipse at 85% 90%,#2f5f8f 0%,rgba(47,95,143,0) 50%),linear-gradient(180deg,#2a2258,#1b2a55)}
.stars{position:absolute;inset:0;pointer-events:none;background-image:
  radial-gradient(2px 2px at 40px 60px,#fff,transparent),radial-gradient(1.5px 1.5px at 200px 140px,#fff,transparent),
  radial-gradient(2px 2px at 520px 40px,#fff,transparent),radial-gradient(1.5px 1.5px at 760px 120px,#fff,transparent),
  radial-gradient(2px 2px at 980px 70px,#fff,transparent),radial-gradient(1.5px 1.5px at 1180px 160px,#fff,transparent),
  radial-gradient(1.5px 1.5px at 120px 420px,#fff,transparent),radial-gradient(2px 2px at 640px 380px,#fff,transparent),
  radial-gradient(1.5px 1.5px at 1100px 460px,#fff,transparent),radial-gradient(2px 2px at 330px 650px,#fff,transparent),
  radial-gradient(1.5px 1.5px at 860px 600px,#fff,transparent),radial-gradient(2px 2px at 1240px 700px,#fff,transparent);
  opacity:.8;animation:tw 4s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.45}to{opacity:.95}}
#scr{position:absolute;inset:0}
#scr.on{animation:fin .3s ease}
@keyframes fin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ボタン：大きさは L(64) M(56) S(48) の3種類だけ */
.btn{position:absolute;display:flex;align-items:center;justify-content:center;gap:8px;border:4px solid #fff;border-radius:999px;font-family:inherit;font-weight:900;color:#fff;cursor:pointer;letter-spacing:.04em;white-space:nowrap;
  background:linear-gradient(180deg,var(--c1,#c9b8ff),var(--c2,#a48ff0));box-shadow:0 6px 0 var(--c3,#8270cf),0 12px 22px rgba(10,5,40,.3);text-shadow:0 2px 0 rgba(0,0,0,.12);
  transition:transform .18s cubic-bezier(.3,1.6,.5,1),box-shadow .18s,filter .2s;outline:none}
.btn::after{content:"";position:absolute;left:14%;right:14%;top:6px;height:30%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.btn:hover{transform:translateY(-3px) scale(1.03);filter:brightness(1.05)}
.btn:active{transform:translateY(4px) scale(.97);box-shadow:0 2px 0 var(--c3,#8270cf)}
.btn.dis{filter:grayscale(.8);opacity:.5;pointer-events:none}
.btn.mint{--c1:#a6ecd2;--c2:#6fd0ad;--c3:#4fb28f}
.btn.pink{--c1:#ffc4dd;--c2:#ff92bf;--c3:#e46f9f}
.btn.sky{--c1:#bfe3ff;--c2:#83c2f7;--c3:#5d9fd8}
.btn.lemon{--c1:#ffeaa8;--c2:#ffcf5c;--c3:#e0a93a;color:#7a5a20;text-shadow:none}
.btn.peach{--c1:#ffd2bd;--c2:#ffa98a;--c3:#e08766}
.btn.white{--c1:#ffffff;--c2:#f1ebff;--c3:#cfc3ee;color:var(--ink);text-shadow:none}
.btn.sel{--c1:#ffeaa8;--c2:#ffcf5c;--c3:#e0a93a;color:#7a5a20;text-shadow:none}
.btn.okb{--c1:#a6ecd2;--c2:#6fd0ad;--c3:#4fb28f;color:#fff}
.btn.ngb{--c1:#ffc4dd;--c2:#ff92bf;--c3:#e46f9f;color:#fff}
.L{height:64px;font-size:28px}.M{height:56px;font-size:23px}.S{height:48px;font-size:20px}
.btn.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* 上のバー */
#bar{position:absolute;left:0;top:0;width:1280px;height:76px;z-index:5}
#bar .back{left:24px;top:12px;width:150px}
#bar .back .arw{width:0;height:0;border-top:9px solid transparent;border-bottom:9px solid transparent;border-right:13px solid currentColor}
#bar .ttl{position:absolute;left:200px;right:200px;top:12px;height:52px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:27px;font-weight:900;letter-spacing:.05em;text-shadow:0 3px 0 rgba(0,0,0,.25);white-space:nowrap;overflow:hidden}
#bar .chip{position:absolute;right:24px;top:16px;width:150px;height:44px;border-radius:999px;background:rgba(255,255,255,.16);border:3px solid rgba(255,255,255,.6);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center}
#bar .chip:empty{display:none}

/* うさとろ＋吹き出し（問題とセリフを上にまとめる） */
#talk{position:absolute;left:0;top:80px;width:1280px;height:104px;z-index:6}
#usa{position:absolute;left:18px;top:-6px;width:112px;height:112px;pointer-events:none}
#usa img{width:100%;height:100%;object-fit:contain;animation:fuwa 3.2s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
@keyframes fuwa{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
#usa.jump img{animation:jump .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes jump{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-26px) scale(1.08,.94)}60%{transform:translateY(0) scale(.94,1.06)}100%{transform:translateY(0)}}
#usa.sad img{animation:sad 1s ease}
@keyframes sad{0%,100%{transform:translateY(0)}50%{transform:translateY(8px) rotate(-8deg) scale(.96)}}
#bal{position:absolute;left:146px;right:24px;top:4px;height:96px;background:#fff;border:4px solid var(--lav2);border-radius:24px;padding:0 24px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 6px 0 rgba(60,40,120,.2)}
#bal::before{content:"";position:absolute;left:-22px;top:30px;border-right:24px solid #fff;border-top:12px solid transparent;border-bottom:12px solid transparent}
#bal.hashint{padding-right:180px}
#bal .q{font-size:24px;font-weight:900;line-height:1.35;white-space:nowrap}
#bal .s{font-size:20px;line-height:1.4;color:var(--ink2);white-space:nowrap}
#bal .s b{color:#e46f9f}
#bal.only .s{font-size:23px;color:var(--ink);line-height:1.5;white-space:normal;word-break:keep-all}
#bal .q:empty,#bal .s:empty{display:none}
#hintb{right:16px;top:20px;width:150px}

/* パネル */
.panel{position:absolute;background:var(--glass);border:4px solid #fff;border-radius:26px;box-shadow:var(--shadow)}
.main{left:24px;top:196px;width:880px;height:508px;overflow:hidden}
.side{left:924px;top:196px;width:332px;height:508px}
.side .pt{position:absolute;left:20px;right:20px;top:18px;font-size:21px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.side .pt b{color:#e46f9f}
.side .pt .h{font-size:18px;color:var(--ink2);display:block}
svg text{font-family:"ZMG","Zen Maru Gothic",sans-serif;font-weight:700}

/* タイトル */
.logo{position:absolute;left:0;right:0;top:140px;text-align:center;color:#fff}
.logo .s{font-size:30px;letter-spacing:.3em;opacity:.9}
.logo .m{font-size:92px;font-weight:900;letter-spacing:.06em;text-shadow:0 6px 0 #7a63d6,0 14px 30px rgba(0,0,0,.4)}
.planet{position:absolute;border-radius:50%}
.tusa{position:absolute;left:540px;top:370px;width:200px;height:200px;animation:fuwa 3.2s ease-in-out infinite}

/* カード */
.card{position:absolute;background:#fff;border:4px solid #fff;border-radius:24px;box-shadow:var(--shadow);cursor:pointer;transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.card:hover{transform:translateY(-4px) scale(1.02)}
.card.empty{background:rgba(255,255,255,.08);border:4px dashed rgba(255,255,255,.4);box-shadow:none;cursor:default;color:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-size:20px}
.card.empty:hover{transform:none}
.ucard .g{position:absolute;left:18px;top:16px;height:32px;padding:0 14px;border-radius:999px;background:var(--pink);color:#fff;font-size:18px;display:flex;align-items:center}
.ucard .t{position:absolute;left:18px;right:18px;top:60px;font-size:30px;font-weight:900;white-space:nowrap;overflow:hidden}
.ucard .gauge{position:absolute;left:18px;right:18px;bottom:20px;height:22px;border-radius:999px;background:var(--lav2);overflow:hidden}
.ucard .gauge i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),#5fc9a3);border-radius:999px}
.ucard .n{position:absolute;right:18px;bottom:50px;font-size:18px;color:var(--ink2)}
.pnum{position:absolute;width:160px;height:56px;color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center}
.mcard{width:232px;height:420px;top:204px}
.mcard .ic{position:absolute;left:36px;top:24px;width:152px;height:152px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.mcard .t{position:absolute;left:0;right:0;top:192px;text-align:center;font-size:32px;font-weight:900}
.mcard .d{position:absolute;left:12px;right:12px;top:248px;text-align:center;font-size:19px;color:var(--ink2);line-height:1.4}
.mcard .p{position:absolute;left:30px;right:30px;bottom:24px;height:36px;border-radius:999px;background:var(--lav2);font-size:18px;display:flex;align-items:center;justify-content:center;gap:6px}
.mcard .p i{display:block;width:22px;height:22px}
.scard{width:280px;height:200px}
.scard .no{position:absolute;left:18px;top:16px;width:64px;height:36px;border-radius:999px;background:var(--sky);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center}
.scard .t{position:absolute;left:18px;right:18px;top:66px;font-size:24px;font-weight:900;line-height:1.35}
.scard .st{position:absolute;right:16px;top:12px;width:44px;height:44px}
.scard .d{position:absolute;left:18px;right:18px;bottom:16px;font-size:16px;color:var(--ink2);white-space:nowrap;overflow:hidden}

/* みわける */
.cell{position:absolute;width:284px;height:245px;background:#fff;border:4px solid var(--lav2);border-radius:20px;cursor:pointer;transition:transform .15s}
.cell:hover{transform:scale(1.015)}
.cell.base{background:var(--sky2);border-color:var(--sky);cursor:default}
.cell.base:hover{transform:none}
.cell.on{border-color:#ffcf5c;background:var(--lemon2);box-shadow:0 0 0 4px #ffcf5c}
.cell.ok{border-color:#6fd0ad;background:var(--mint2)}
.cell.ng{border-color:#ff92bf;background:var(--pink2)}
.cell .nm{position:absolute;left:10px;top:8px;width:40px;height:40px;border-radius:50%;background:var(--lav);color:#fff;font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center;z-index:2}
.cell.base .nm{background:var(--sky)}
.cell svg{position:absolute;left:0;top:0}

/* テンキー */
.disp{position:absolute;left:20px;right:20px;top:20px;height:72px;border-radius:18px;background:#fff;border:4px solid var(--lav2);display:flex;align-items:center;justify-content:flex-end;padding:0 20px;font-size:40px;font-weight:900;gap:8px}
.disp .u,.disp .pre{font-size:24px;color:var(--ink2)}
.disp.ok{border-color:#6fd0ad;background:var(--mint2)}
.disp.ng{border-color:#ff92bf;background:var(--pink2)}

/* スタンプ・結果 */
.stamp{position:absolute;left:50%;top:50%;width:220px;height:220px;margin:-110px 0 0 -110px;pointer-events:none;animation:stamp .9s cubic-bezier(.3,1.6,.5,1) forwards;z-index:4}
@keyframes stamp{0%{transform:scale(2.2);opacity:0}25%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
.res{left:240px;top:196px;width:800px;height:508px}
.res .big{position:absolute;left:0;right:0;top:40px;text-align:center;font-size:44px;font-weight:900}
.res .star{position:absolute;left:325px;top:110px;width:150px;height:150px;animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.res .info{position:absolute;left:0;right:0;top:282px;text-align:center;font-size:24px;line-height:1.7;color:var(--ink2)}

/* せってい */
.setrow{position:absolute;left:60px;width:200px;height:56px;display:flex;align-items:center;font-size:24px;font-weight:900}

</style>
</head>

<script>
// さんすうスペースラボ 共通部品（画面・セーブ・音・うさとろ・図形・テンキー）
(function(){
const S6=window.SANSU6={units:[],addUnit(u){this.units.push(u)}};
const NS='http://www.w3.org/2000/svg';

// ---------- 乱数（シードつき：とちゅうから再開しても同じ問題になる） ----------
S6.rng=function(seed){let s=(seed>>>0)||123456789;
  const r=()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return (s>>>0)/4294967296};
  r.int=n=>Math.floor(r()*n);r.pick=a=>a[r.int(a.length)];
  r.shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=r.int(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};return r};

// ---------- セーブ（オートセーブ） ----------
const KEY='sansu6';let SV=null;
try{SV=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!SV||SV.v!==1)SV={v:1,se:1,u:{}};
S6.SV=()=>SV;
S6.save=()=>{try{localStorage.setItem(KEY,JSON.stringify(SV))}catch(e){}};
S6.U=id=>SV.u[id]||(SV.u[id]={st:{},test:{best:0,pass:0},resume:null});
S6.reset=()=>{SV={v:1,se:SV.se,u:{}};S6.save()};

// ---------- 効果音（過去作から流用 se.js） ----------
S6.se=n=>{const v=[0,.35,.8][SV.se];if(!v||!window.S6_SE||!S6_SE[n])return;try{const a=new Audio(S6_SE[n]);a.volume=v;a.play().catch(()=>{})}catch(e){}};

// ---------- DOM ----------
S6.h=function(tag,cls,par,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(par)par.appendChild(e);return e};
S6.btn=function(par,o){const b=S6.h('button','btn '+(o.c||'white')+' '+(o.z||'M'),par,o.t);
  b.style.left=o.x+'px';b.style.top=o.y+'px';if(o.w)b.style.width=o.w+'px';
  b.onclick=e=>{if(b.classList.contains('dis'))return;S6.se(o.se||'tap');o.on&&o.on(e,b)};return b};
S6.svg=function(par,w,h,x,y){const s=document.createElementNS(NS,'svg');s.setAttribute('width',w);s.setAttribute('height',h);
  if(x!=null){s.style.position='absolute';s.style.left=x+'px';s.style.top=y+'px'}par.appendChild(s);return s};
S6.el=function(tag,at,par){const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);if(par)par.appendChild(e);return e};
S6.txt=function(par,x,y,s,size,col,anchor,weight){const t=S6.el('text',{x,y,'font-size':size||16,fill:col||'#4d4270','text-anchor':anchor||'middle','dominant-baseline':'central'},par);
  if(weight)t.setAttribute('font-weight',weight);t.textContent=s;return t};
S6.STAR=f=>`<svg viewBox="0 0 24 24" width="100%" height="100%"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="${f}" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
S6.STARC=v=>v>=2?'#ffcf5c':v>=1?'#aeb6d0':'#ece8f6';

// ---------- 画面の大きさ合わせ ----------
let stage,scr,bar,talk;
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);stage.style.transform=`scale(${s})`;stage.style.left=(innerWidth-1280*s)/2+'px';stage.style.top=(innerHeight-720*s)/2+'px'}
S6.init=function(){stage=document.getElementById('stage');scr=document.getElementById('scr');bar=document.getElementById('bar');talk=document.getElementById('talk');
  addEventListener('resize',fit);fit()};

// 画面を出す。o={title, back:fn, chip, talk:true/false, render(root)}
S6.show=function(o){scr.innerHTML='';scr.className='';void scr.offsetWidth;scr.className='on';
  bar.innerHTML='';bar.style.display=o.title?'':'none';
  if(o.title){if(o.back)S6.btn(bar,{t:'<span class="arw"></span>もどる',x:24,y:12,w:150,c:'white back',on:o.back,se:'tap'});
    S6.h('div','ttl',bar,o.title);S6.h('div','chip',bar,o.chip||'')}
  talk.style.display=o.talk===false?'none':'';hintFn=null;$('#hintb').style.display='none';$('#bal').classList.remove('hashint');
  o.render(scr)};
S6.chip=t=>{const c=bar.querySelector('.chip');if(c)c.innerHTML=t};
const $=s=>document.querySelector(s);

// ---------- うさとろ ----------
let hintFn=null;
S6.talk=function(q,s,mood){const b=$('#bal');b.querySelector('.q').innerHTML=q||'';b.querySelector('.s').innerHTML=s||'';b.classList.toggle('only',!q);S6.mood(mood)};
S6.say=function(s,mood){$('#bal .s').innerHTML=s||'';S6.mood(mood)};
S6.mood=function(m){const u=$('#usa');u.className='';if(m){void u.offsetWidth;u.className=m}};
S6.setHint=function(fn){hintFn=fn;$('#hintb').style.display=fn?'':'none';$('#bal').classList.toggle('hashint',!!fn)};
S6.hintClick=()=>{S6.se('tap');hintFn&&hintFn()};

// ---------- 図形 ----------
const G=S6.G={
 len:(a,b)=>Math.hypot(b[0]-a[0],b[1]-a[1]),
 area(p){let s=0;for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];s+=a[0]*b[1]-b[0]*a[1]}return s/2},
 ang(p,i){const n=p.length,a=p[(i+n-1)%n],b=p[i],c=p[(i+1)%n];const u=[a[0]-b[0],a[1]-b[1]],v=[c[0]-b[0],c[1]-b[1]];
   return Math.acos(Math.max(-1,Math.min(1,(u[0]*v[0]+u[1]*v[1])/(Math.hypot(...u)*Math.hypot(...v)))))*180/Math.PI},
 sides:p=>p.map((q,i)=>G.len(q,p[(i+1)%p.length])),
 fmt(x){const r=Math.round(x*10)/10;return Number.isInteger(r)?String(r):r.toFixed(1)},
 kname(k){const f=G.frac(k);return f?f:G.fmt(k)},
 frac(k){for(const d of [2,3,4,5])if(Math.abs(k*d-1)<1e-9)return '1/'+d;return null},
 bbox(p){const xs=p.map(q=>q[0]),ys=p.map(q=>q[1]);return{x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)}},
 // k倍・回転(90度×rot)・裏返し
 tf(p,k,rot,flip){return p.map(([x,y])=>{if(flip)x=-x;let X=x*k,Y=y*k;for(let r=0;r<(rot||0);r++)[X,Y]=[-Y,X];return[X,Y]})},
 scaleXY:(p,sx,sy)=>p.map(([x,y])=>[x*sx,y*sy]),
 // 2つの多角形が 拡大図・縮図の関係か（回転・裏返しOK）。関係なら倍率を返す
 similar(p,q){const n=p.length;if(q.length!==n)return 0;const L1=G.sides(p),L2=G.sides(q),A1=p.map((_,i)=>G.ang(p,i)),A2=q.map((_,i)=>G.ang(q,i));
   for(const dir of [1,-1])for(let s=0;s<n;s++){let k=null,ok=true;
     for(let i=0;i<n&&ok;i++){const j=((s+dir*i)%n+n)%n;const je=dir===1?j:((j-1)%n+n)%n;
       const r=L2[je]/L1[i];if(k===null)k=r;if(Math.abs(r-k)>1e-6*Math.max(1,k))ok=false;
       if(Math.abs(A1[i]-A2[j])>0.05)ok=false}
     if(ok)return k}
   return 0},
 // 多角形をかく  o:{s:1cmのpx, cx,cy, side, angle, names, hideS:{i:'□cm'}, hideA:{i:'□°'}, hl:{v:[],e:[]}, fill, stroke, fs, lw}
 draw(svg,p,o){const s=o.s,b=G.bbox(p),ox=o.cx-(b.x+b.w/2)*s,oy=o.cy-(b.y+b.h/2)*s,el=S6.el,txt=S6.txt;
  const P=p.map(([x,y])=>[ox+x*s,oy+y*s]),g=el('g',{},svg),cw=G.area(P)>0?1:-1,n=P.length,fs=o.fs||16;
  el('polygon',{points:P.map(q=>q.join(',')).join(' '),fill:o.fill||'#ddf0ff',stroke:o.stroke||'#5d9fd8','stroke-width':o.lw||3,'stroke-linejoin':'round'},g);
  if(o.hl&&o.hl.e)o.hl.e.forEach(i=>{const a=P[i],c=P[(i+1)%n];el('line',{x1:a[0],y1:a[1],x2:c[0],y2:c[1],stroke:'#ff5f9e','stroke-width':7,'stroke-linecap':'round'},g)});
  // 角（内側）：弧と数字
  if(o.angle)for(let i=0;i<n;i++){if(Array.isArray(o.angle)&&!o.angle.includes(i))continue;
    const a=P[(i+n-1)%n],c=P[(i+1)%n],v0=P[i];const u=[a[0]-v0[0],a[1]-v0[1]],v=[c[0]-v0[0],c[1]-v0[1]],lu=Math.hypot(...u),lv=Math.hypot(...v);
    const ux=u[0]/lu,uy=u[1]/lu,vx=v[0]/lv,vy=v[1]/lv;let bx=ux+vx,by=uy+vy;const bl=Math.hypot(bx,by)||1;bx/=bl;by/=bl;
    const A=G.ang(p,i),hid=o.hideA&&o.hideA[i],col=hid?'#e46f9f':'#8270cf',r=15;
    if(Math.abs(A-90)<0.5){const q=10;el('path',{d:`M${v0[0]+ux*q} ${v0[1]+uy*q} L${v0[0]+ux*q+vx*q} ${v0[1]+uy*q+vy*q} L${v0[0]+vx*q} ${v0[1]+vy*q}`,fill:'none',stroke:col,'stroke-width':2},g)}
    else{const sw=(ux*vy-uy*vx)>0?1:0;el('path',{d:`M${v0[0]+ux*r} ${v0[1]+uy*r} A${r} ${r} 0 0 ${sw} ${v0[0]+vx*r} ${v0[1]+vy*r}`,fill:'none',stroke:col,'stroke-width':2},g)}
    const d=Math.min(56,Math.max(26,16/Math.sin(A*Math.PI/360)));txt(g,v0[0]+bx*d,v0[1]+by*d,hid||Math.round(A)+'°',fs-1,col)}
  // 辺（外側）
  if(o.side)for(let i=0;i<n;i++){if(Array.isArray(o.side)&&!o.side.includes(i))continue;
    const a=P[i],c=P[(i+1)%n],m=[(a[0]+c[0])/2,(a[1]+c[1])/2],L=Math.hypot(c[0]-a[0],c[1]-a[1]);
    const nx=(c[1]-a[1])/L*cw,ny=-(c[0]-a[0])/L*cw,hid=o.hideS&&o.hideS[i],t=hid||G.fmt(G.len(p[i],p[(i+1)%n]))+'cm';
    const off=12+Math.abs(nx)*(t.length*fs*.29)+Math.abs(ny)*fs*.55;txt(g,m[0]+nx*off,m[1]+ny*off,t,fs,hid?'#e46f9f':'#4d4270')}
  if(o.names){o.names.forEach((nm,i)=>{if(!nm)return;const q=P[i],a=P[(i+n-1)%n],c=P[(i+1)%n];
      const ua=[a[0]-q[0],a[1]-q[1]],uc=[c[0]-q[0],c[1]-q[1]],la=Math.hypot(...ua),lc=Math.hypot(...uc);let bx=-(ua[0]/la+uc[0]/lc),by=-(ua[1]/la+uc[1]/lc);const bl=Math.hypot(bx,by)||1;bx/=bl;by/=bl;
      if(o.hl&&o.hl.v&&o.hl.v.includes(i))el('circle',{cx:q[0],cy:q[1],r:11,fill:'#ff5f9e',stroke:'#fff','stroke-width':3},g);
      txt(g,q[0]+bx*22,q[1]+by*22,nm,21,'#4d4270','middle',900)})}
  return{g,P}},
 // はみ出し・文字の重なりがない大きさを探してかく（大きい順にためす）
 drawSafe(svg,p,o,list){const W=+svg.getAttribute('width'),H=+svg.getAttribute('height');let last=null;
  for(const fs of [o.fs||16,(o.fs||16)-2])for(const s of list){if(last)last.g.remove();last=G.draw(svg,p,Object.assign({},o,{s,fs}));const ts=[...last.g.querySelectorAll('text')].map(x=>x.getBBox());
   const out=ts.some(b=>b.x<2||b.y<2||b.x+b.width>W-2||b.y+b.height>H-2);let ov=false;
   for(let i=0;i<ts.length&&!ov;i++)for(let j=i+1;j<ts.length;j++){const a=ts[i],b=ts[j];if(a.x+1<b.x+b.width&&b.x+1<a.x+a.width&&a.y+1<b.y+b.height&&b.y+1<a.y+a.height){ov=true;break}}
   if(!out&&!ov)return last}return last},
 // いくつかの図形を同じ縮尺で入れる大きさ
 fit(polys,w,h){let s=1e9;polys.forEach(p=>{const b=G.bbox(p);s=Math.min(s,w/(b.w||1e-9),h/(b.h||1e-9))});return s}
};

<script>
// さんすうスペースラボ 画面と問題の型（どの単元でも使う）
(function(){
const S6=SANSU6,h=S6.h,btn=S6.btn,G=S6.G;

const ICON={

 miwake:'<svg width="110" height="110" viewBox="0 0 110 110"><polygon points="15,50 45,50 15,25" fill="#fff"/><polygon points="55,95 100,95 55,57" fill="#fff"/><path d="M62 30l8 8 16-18" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
 kaku:'<svg width="110" height="110" viewBox="0 0 110 110"><g stroke="rgba(255,255,255,.55)" stroke-width="2"><path d="M15 15v80M35 15v80M55 15v80M75 15v80M95 15v80M15 15h80M15 35h80M15 55h80M15 75h80M15 95h80"/></g><polyline points="15,95 75,95 15,35 15,95" fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="round"/><circle cx="75" cy="95" r="7" fill="#fff"/></svg>',
 motome:'<svg width="110" height="110" viewBox="0 0 110 110"><rect x="18" y="18" width="74" height="74" rx="14" fill="none" stroke="#fff" stroke-width="6"/><path d="M38 42h34M55 25v34M38 74h34M38 84h34" stroke="#fff" stroke-width="6" stroke-linecap="round"/></svg>',
 test:'<svg width="110" height="110" viewBox="0 0 110 110"><circle cx="55" cy="62" r="32" fill="#fff"/><path d="M38 12l17 22 17-22" fill="none" stroke="#fff" stroke-width="8" stroke-linejoin="round"/><path d="M55 46l5 10 11 1.5-8 7.5 2 11-10-5.5-10 5.5 2-11-8-7.5 11-1.5z" fill="#ffcf5c"/></svg>'};

const key=(m,st)=>m.id+'/'+st.id;

// ---------- 問題を順に出す（練習・たしかめ・テスト共通） ----------
E.run=function(u,m,st,opt){opt=opt||{};const US=S6.U(u.id),k=key(m,st),test=!!m.test,keep=!opt.items;let R;

  const persist=()=>{if(!keep)return;US.resume={key:k,seed:R.seed,i:R.i,miss:R.miss,hint:R.hint,ok:R.ok};S6.save()};

  function next(){R.i++;if(R.i>=R.items.length){if(keep)US.resume=null;E.result(u,m,st,R)}else{persist();item()}}
  function item(){const it=R.items[R.i];let im=0,hi=0,done=false;

    S6.talk('',v===2?'金の星 だよ！ かんぺき だね。':'クリア おめでとう！ つぎは 金の星 を めざそう。','jump')}

// ---------- 型：図と えらぶ（ボタン） ----------
function figArea(it,main){const svg=S6.svg(main,872,500);if(it.fig)it.fig(svg);
  else if(it.body){const d=h('div','',main,it.body);Object.assign(d.style,{position:'absolute',left:'40px',right:'40px',top:'0',bottom:'0',display:'flex',alignItems:'center',justifyContent:'center',textAlign:'center',fontSize:'32px',lineHeight:'1.7',fontWeight:'900'})}

function pickButtons(side,opts,ans,ctx,y0,onRight){const bs=[];let locked=false;
  opts.forEach((t,i)=>bs.push(btn(side,{t,x:20,y:y0+i*66,w:292,c:'white',z:t.length>9?'S':'M',on:(e,b)=>{if(locked)return;
    if(i===ans){b.className=b.className.replace('white','okb');locked=true;bs.forEach(x=>x!==b&&x.classList.add('dis'));(onRight||ctx.right)()}
    else{b.className=b.className.replace('white','ngb');b.classList.add('shake');
      if(ctx.test){locked=true;bs[ans].className=bs[ans].className.replace('white','okb');ctx.wrong()}else{b.classList.add('dis');ctx.wrong()}}}})));
  bs.forEach(b=>{if(b.classList.contains('S'))b.style.top=(parseFloat(b.style.top)+4)+'px'});return bs}
K.pick=function(it,ctx){figArea(it,ctx.main);pickButtons(ctx.side,it.opts,it.ans,ctx,20)};

// ---------- 型：数を答える（テンキー） ----------
K.num=function(it,ctx){figArea(it,ctx.main);const np=S6.numpad(ctx.side,{unit:it.unit,prefix:it.prefix});
  const ok=ctx.act('けってい',()=>{const v=np.num();if(isNaN(v)){S6.say('テンキー で こたえ を 入れてね。');return}
    if(Math.abs(v-it.ans)<1e-6){np.mark('ok');np.lock(true);ctx.right()}
    else{np.mark('ng');if(ctx.test){np.lock(true);ctx.wrong()}else ctx.wrong()}})};

// ---------- 型：みわける（図の一覧からえらぶ） ----------
// it.cands=[{p, base, ok, k}] 1つ目が「あ」。it.follow={q,opts,ans}
K.choose=function(it,ctx){const NM='あいうえおか',main=ctx.main,side=ctx.side,cs=it.cands;
  const A0=Math.abs(G.area(cs[0].p));cs.forEach(c=>{const kk=Math.sqrt(Math.abs(G.area(c.p))/A0);c.f=Math.pow(kk,0.25)/kk});
  let cc=1e9;cs.forEach(c=>{const b=G.bbox(c.p);cc=Math.min(cc,180/(b.w*c.f),150/(b.h*c.f))});
  const sel=new Set(),cells=[];let locked=false;
  cs.forEach((c,i)=>{const d=pos(h('div','cell'+(c.base?' base':''),main),i%3*294,Math.floor(i/3)*255);d.innerHTML=`<div class="nm">${NM[i]}</div>`;
    const b=G.bbox(c.p),own=Math.min(180/b.w,150/b.h),mn=Math.min(b.w,b.h);const sv=S6.svg(d,276,237),s0=Math.min(own*1.1,Math.max(cc*c.f,95/mn));G.drawSafe(sv,c.p,{cx:142,cy:126,side:1,angle:1,fs:15,fill:c.base?'#fff':'#ddf0ff'},[1.15,1.08,1,.92,.85,.78].map(f=>Math.min(own*1.15,s0*f)));cells.push(d);
    if(!c.base)d.onclick=()=>{if(locked)return;S6.se('tap');sel.has(i)?sel.delete(i):sel.add(i);d.classList.toggle('on')}});
  const pt=h('div','pt',side,'あ と くらべて、<br>拡大図・縮図 を<br>ぜんぶ えらんだら、<br>こたえあわせ を<br>おしてね。');
  const right=cs.map((c,i)=>c.ok?i:-1).filter(i=>i>0);
  ctx.act('こたえあわせ',()=>{if(locked)return;if(!sel.size){S6.say('図 を クリック して えらんでね。');return}
    const ok=right.length===sel.size&&right.every(i=>sel.has(i));
    if(ctx.test||ok||ctx.misses()>=1){locked=true;cells.forEach((d,i)=>{if(!i)return;d.classList.remove('on');if(cs[i].ok)d.classList.add('ok');else if(sel.has(i))d.classList.add('ng')});
      if(!ok){ctx.wrong();if(ctx.test)return;S6.say(it.explain,'sad')}
      if(it.follow&&!ctx.test){side.querySelectorAll('.act').forEach(b=>b.remove());const f=it.follow;pt.innerHTML=f.q;
        if(ok)S6.say('せいかい！ では、つぎ の しつもん だよ。','jump'),S6.se('ok');
        pickButtons(side,f.opts,f.ans,ctx,150)}else if(ok)ctx.right()}
    else{const bad=[...sel].filter(i=>!cs[i].ok);bad.forEach(i=>{sel.delete(i);cells[i].classList.remove('on');cells[i].classList.add('ng');setTimeout(()=>cells[i].classList.remove('ng'),900)});
      ctx.wrong();S6.say(bad.length?`${bad.map(i=>NM[i]).join('・')} は ちがうよ。角の大きさ と 辺の長さ の 倍 を くらべよう。`:'まだ ほかにも あるよ。向き が ちがう図 も 見てみよう。','sad')}})};

// ---------- 型：方眼にかく（直線ツール） ----------
// it={org, names, k, mode:'free'|'anchor'|'center', at:[x,y], v:0, center:[x,y], start(推奨位置)}
const C=28,OX=16,OY=12,COLS=30,ROWS=17,X=i=>OX+i*C,Y=j=>OY+j*C;
function pieces(a,b){const dx=b[0]-a[0],dy=b[1]-a[1],g=(function f(m,n){return n?f(n,m%n):m})(Math.abs(dx),Math.abs(dy)),sx=dx/g,sy=dy/g,out=[];
  for(let i=0;i<g;i++){const p=[a[0]+sx*i,a[1]+sy*i],q=[p[0]+sx,p[1]+sy];out.push(p[0]<q[0]||(p[0]===q[0]&&p[1]<q[1])?p+'|'+q:q+'|'+p)}return out}
E.drawTarget=function(it){const o=it.org,k=it.k;
  if(it.mode==='center')return o.map(([x,y])=>[it.center[0]+(x-it.center[0])*k,it.center[1]+(y-it.center[1])*k]);
  if(it.mode==='anchor'){const v=o[it.v||0];return o.map(([x,y])=>[it.at[0]+(x-v[0])*k,it.at[1]+(y-v[1])*k])}
  return o.map(([x,y])=>[x*k,y*k])};
E.judgeDraw=function(it,segs){const T=E.drawTarget(it),mine=new Set();segs.forEach(s=>pieces(...s).forEach(q=>mine.add(q)));
  const tset=t=>{const s=new Set();T.forEach((v,i)=>{const w=T[(i+1)%T.length];pieces([v[0]+t[0],v[1]+t[1]],[w[0]+t[0],w[1]+t[1]]).forEach(q=>s.add(q))});return s};
  const cand=it.mode==='free'?[]:[[0,0]];if(it.mode==='free')segs.flat().forEach(p=>T.forEach(v=>cand.push([p[0]-v[0],p[1]-v[1]])));
  let best=null;cand.forEach(t=>{const tp=tset(t);let sc=0;tp.forEach(q=>{if(!mine.has(q))sc++});mine.forEach(q=>{if(!tp.has(q))sc+=1});if(!best||sc<best.sc)best={sc,tp}});
  const bad=new Set();segs.forEach((s,i)=>{if(!best||pieces(...s).some(q=>!best.tp.has(q)))bad.add(i)});
  return{ok:!!best&&best.sc===0&&segs.length>0,bad}};
K.draw=function(it,ctx){const main=ctx.main,side=ctx.side,el=S6.el,txt=S6.txt;let segs=[],start=null,hover=null,bad=null,locked=false,showHint=0;
  const svg=S6.svg(main,872,500);
  function gp(e){const r=svg.getBoundingClientRect(),sc=r.width/872;return[Math.max(0,Math.min(COLS,Math.round(((e.clientX-r.left)/sc-OX)/C))),Math.max(0,Math.min(ROWS,Math.round(((e.clientY-r.top)/sc-OY)/C)))]}
  function paint(){svg.innerHTML='';el('rect',{x:0,y:0,width:872,height:500,fill:'#fff'},svg);
    for(let i=0;i<=COLS;i++)el('line',{x1:X(i),y1:Y(0),x2:X(i),y2:Y(ROWS),stroke:i%5?'#e3e7f7':'#c9cfe9','stroke-width':i%5?1:1.5},svg);
    for(let j=0;j<=ROWS;j++)el('line',{x1:X(0),y1:Y(j),x2:X(COLS),y2:Y(j),stroke:j%5?'#e3e7f7':'#c9cfe9','stroke-width':j%5?1:1.5},svg);
    const o=it.org;el('polygon',{points:o.map(p=>X(p[0])+','+Y(p[1])).join(' '),fill:'#ddf0ff',stroke:'#5d9fd8','stroke-width':3,'stroke-linejoin':'round'},svg);
    const cx=o.reduce((s,p)=>s+p[0],0)/o.length,cy=o.reduce((s,p)=>s+p[1],0)/o.length;
    (it.names||[]).forEach((n,i)=>{if(it.mode==='center'&&o[i][0]===it.center[0]&&o[i][1]===it.center[1])n=n+'＝O';const dx=o[i][0]-cx,dy=o[i][1]-cy,dl=Math.hypot(dx,dy)||1;txt(svg,X(o[i][0])+dx/dl*20,Y(o[i][1])+dy/dl*20,n,19,'#4d4270','middle',900)});
    if(it.mode==='center'){const c=it.center;if(showHint)o.forEach(p=>{const t=[c[0]+(p[0]-c[0])*Math.max(it.k,1.0001),c[1]+(p[1]-c[1])*Math.max(it.k,1)];el('line',{x1:X(c[0]),y1:Y(c[1]),x2:X(t[0]),y2:Y(t[1]),stroke:'#ffb3cf','stroke-width':2,'stroke-dasharray':'6 5'},svg)});
      el('circle',{cx:X(c[0]),cy:Y(c[1]),r:6,fill:'#4d4270'},svg);if(!o.some(p=>p[0]===c[0]&&p[1]===c[1]))txt(svg,X(c[0])-16,Y(c[1])+16,'O',19,'#4d4270','middle',900)}
    if(it.mode==='anchor'){el('circle',{cx:X(it.at[0]),cy:Y(it.at[1]),r:7,fill:'#e46f9f',stroke:'#fff','stroke-width':2},svg);txt(svg,X(it.at[0])-18,Y(it.at[1])-16,it.atName||'D',19,'#e46f9f','middle',900)}
    if(showHint>=2){const T=E.drawTarget(it),sh=it.mode==='free'?it.start:[0,0];T.forEach(p=>el('circle',{cx:X(p[0]+sh[0]),cy:Y(p[1]+sh[1]),r:6,fill:'#ffcf5c',stroke:'#fff','stroke-width':2},svg))}
    segs.forEach((g,i)=>el('line',{x1:X(g[0][0]),y1:Y(g[0][1]),x2:X(g[1][0]),y2:Y(g[1][1]),stroke:bad?(bad.has(i)?'#ff5f9e':'#3fb88c'):'#7a63d6','stroke-width':5,'stroke-linecap':'round'},svg));
    if(start&&hover&&!locked)el('line',{x1:X(start[0]),y1:Y(start[1]),x2:X(hover[0]),y2:Y(hover[1]),stroke:'#b9a6f2','stroke-width':4,'stroke-dasharray':'8 6','stroke-linecap':'round'},svg);
    if(hover&&!locked)el('circle',{cx:X(hover[0]),cy:Y(hover[1]),r:7,fill:'none',stroke:'#7a63d6','stroke-width':3},svg);
    if(start&&!locked)el('circle',{cx:X(start[0]),cy:Y(start[1]),r:8,fill:'#ff92bf',stroke:'#fff','stroke-width':3},svg)}
  svg.style.cursor='crosshair';
  svg.addEventListener('pointermove',e=>{const p=gp(e);if(!hover||p[0]!==hover[0]||p[1]!==hover[1]){hover=p;paint()}});
  svg.addEventListener('pointerleave',()=>{hover=null;paint()});
  svg.addEventListener('click',e=>{if(locked)return;const p=gp(e);bad=null;
    if(!start)start=p;else if(p[0]===start[0]&&p[1]===start[1])start=null;else{segs.push([start,p]);S6.se('tap');start=p}paint()});
  h('div','pt',side,'<span class="h">つかいかた</span>点 を クリック → つぎの点 を クリック で 線 が ひけるよ。');
  btn(side,{t:'1本 けす',x:20,y:180,w:292,c:'white',on:()=>{if(locked)return;segs.pop();start=segs.length?segs[segs.length-1][1]:null;bad=null;paint()}});
  btn(side,{t:'ぜんぶ けす',x:20,y:248,w:292,c:'white',on:()=>{if(locked)return;segs=[];start=null;bad=null;paint()}});
  btn(side,{t:'線 を とめる',x:20,y:316,w:292,c:'white',on:()=>{start=null;paint()}});
  ctx.onHint=n=>{showHint=Math.min(2,n+1);paint()};
  ctx.act('こたえあわせ',()=>{if(locked)return;start=null;const r=E.judgeDraw(it,segs);bad=r.bad;
    if(!segs.length){S6.say('まだ 線 が ないよ。点 を クリック してみよう。');bad=null;paint();return}
    if(r.ok){locked=true;bad=new Set();ctx.right()}else{if(ctx.test){locked=true;showHint=2}ctx.wrong()}paint()});
  paint()};
})();

</script>
<script>
// 単元：6年「拡大図と縮図」
(function(){
const S6=SANSU6,G=S6.G,el=S6.el,txt=S6.txt,E=S6.E;
const R3=Math.sqrt(3);

// ---------- 図形のもと（cm） ----------
const TRI=[[[0,0],[4,0],[0,3]],[[0,4],[6,4],[3,0]],[[0,0],[6,0],[2.25,-3.3072]]];
const QUAD=[[[0,0],[3,0],[3,2],[0,2]],[[0,0],[3,0],[6,4],[0,4]],[[0,0],[4,0],[5.5,1.5*R3],[1.5,1.5*R3]],[[0,0],[3,0],[3,3],[0,3]]];
const NB=n=>n===3?['A','B','C']:['A','B','C','D'],NT=n=>n===3?['D','E','F']:['E','F','G','H'];
const FN=(n,nm)=>(n===3?'三角形':'四角形')+nm.join('');
const kTxt=k=>k>1?`${G.fmt(k)}倍の拡大図`:`${G.frac(k)}の縮図`;
const minAng=p=>Math.min(...p.map((_,i)=>G.ang(p,i)));
const round2=x=>Math.round(x*1000)/1000;

// 2つの図形をならべてかく
function pair(svg,p,q,o){o=o||{};const W=o.w||300,H=o.h||290,sc=Math.min(G.fit([p,q],W,H),o.max||60);
  const s1=Math.min(o.max||60,Math.max(sc,.6*G.fit([p],W,H))),s2=Math.min(o.max||60,Math.max(sc,.6*G.fit([q],W,H)));
  G.draw(svg,p,Object.assign({s:s1,cx:o.cx1||220,cy:o.cy||240,fill:'#fff',side:1,angle:o.ab!==undefined?o.ab:1,names:o.nb||NB(p.length)},o.op||{}));
  G.draw(svg,q,Object.assign({s:s2,cx:o.cx2||640,cy:o.cy||240,side:o.sideT!==undefined?o.sideT:1,angle:o.at!==undefined?o.at:0,names:o.nt||NT(q.length)},o.oq||{}));
  if(o.cap!==false){txt(svg,o.cx1||220,470,FN(p.length,o.nb||NB(p.length)),19,'#8a7aa8');txt(svg,o.cx2||640,470,FN(q.length,o.nt||NT(q.length)),19,'#8a7aa8')}
  return sc}

// ---------- みわける ----------
function distractor(r,p){const n=p.length,k=r.pick([0.5,1.5,2]);let q;
  const t=r.int(3);
  if(t===0){const f=r.pick([1.5,2/3,2]);q=G.scaleXY(p,k,k*f)}
  else if(t===1&&n===4){const L=G.sides(p),a=L[0],b=L[1],isPara=Math.abs(G.ang(p,0)-90)>1;
    const th=isPara?Math.PI/2:Math.PI/3;q=[[0,0],[a,0],[a+b*Math.cos(th),b*Math.sin(th)],[b*Math.cos(th),b*Math.sin(th)]].map(([x,y])=>[x*k,y*k])}
  else{const i=r.int(n);q=p.map((v,j)=>j===i?[v[0]+(r.int(2)?1:-1),v[1]+(r.int(2)?0.5:-0.5)]:v).map(([x,y])=>[x*k,y*k])}
  return q}
function makeChoose(r,pool,ks,follow){for(let tries=0;tries<200;tries++){
  const base=r.pick(pool),nc=1+r.int(3),cands=[{p:base,base:1}],ok=[];
  const used=new Set();for(let i=0;i<nc;i++){let k,ro,fl,g=0;do{k=r.pick(ks);ro=r.int(4);fl=r.int(3)===0}while(used.has(k+'_'+ro+'_'+fl)&&g++<20);used.add(k+'_'+ro+'_'+fl);ok.push({p:G.tf(base,k,ro,fl),ok:1,k})}
  const bad=[];let guard=0;while(bad.length<5-nc&&guard++<60){const q=distractor(r,base);
    const qb=G.bbox(q);if(G.similar(base,q)||minAng(q)<28||Math.max(qb.w,qb.h)/Math.min(qb.w,qb.h)>2.4||Math.min(...G.sides(q))<0.4*Math.max(...G.sides(q)))continue;bad.push({p:G.tf(q,1,r.int(4),r.int(3)===0)})}
  if(bad.length<5-nc)continue;
  const all=r.shuffle(ok.concat(bad));cands.push(...all);
  const NM='あいうえおか',okIdx=cands.map((c,i)=>c.ok?i:-1).filter(i=>i>0),fi=okIdx[0],fk=cands[fi].k;
  const pool2=r.shuffle([0.5,1.5,2,2.5,3,1/3].filter(x=>Math.abs(x-fk)>1e-9)).slice(0,3).concat([fk]);const opts=r.shuffle(pool2);
  return{kind:'choose',q:'あ の 拡大図 や 縮図 を ぜんぶ えらぼう',say:'向き が ちがう図 や、うら返した図 も あるよ。',cands,
    hints:['まず 角の大きさ が、あ と ぜんぶ 同じか 見てみよう。','つぎに 辺の長さ。どの辺も 同じ 倍 に なっているかな？'],
    explain:`${okIdx.map(i=>NM[i]).join('・')} が 拡大図・縮図。角が 等しく、辺が どれも 同じ 倍 だよ。`,
    follow:follow?{q:`<span class="h">もう1問</span>${NM[fi]} は あ の<br>何倍 かな？`,opts:opts.map(kTxt),ans:opts.indexOf(fk)}:null}}}

// ---------- かく（方眼） ----------
const DTRI=[[[0,0],[0,3],[4,3]],[[1,0],[0,3],[4,3]],[[0,0],[0,4],[3,4]],[[2,0],[0,3],[3,3]],[[0,0],[4,1],[1,3]]];
const DQUAD=[[[0,0],[3,0],[3,2],[0,2]],[[1,0],[3,0],[4,3],[0,3]],[[1,0],[4,0],[3,2],[0,2]],[[0,0],[3,0],[4,2],[0,3]]];
const DHALF=[[[0,0],[0,6],[8,6]],[[2,0],[6,0],[8,4],[0,4]],[[0,0],[6,0],[6,4],[0,4]],[[4,0],[0,6],[8,6]],[[2,0],[0,6],[6,6]]];
function placeFree(org,k,mode){const b=G.bbox(org),ox=1-b.x,oy=Math.max(1,Math.floor((17-Math.max(b.h,b.h*k))/2))-b.y;
  const o=org.map(([x,y])=>[x+ox,y+oy]),bb=G.bbox(o),T=o.map(([x,y])=>[x*k,y*k]),tb=G.bbox(T);
  const tx=bb.x+bb.w+3,ty=Math.max(1,Math.floor((17-tb.h)/2));return{o,start:[tx-tb.x,ty-tb.y]}}
function drawHints(it){const o=it.org,n=it.names,dx=o[1][0]-o[0][0],dy=o[1][1]-o[0][1],k=it.k,kk=G.kname(k);
  const part=[];if(dx)part.push(`横に ${Math.abs(dx)}マス`);if(dy)part.push(`たてに ${Math.abs(dy)}マス`);
  const part2=[];if(dx)part2.push(`横 ${Math.abs(dx)*k}`);if(dy)part2.push(`たて ${Math.abs(dy)*k}`);
  return[`辺${n[0]}${n[1]} は ${part.join('・')}。${kk}倍 だと ${part2.join('・')} マス だね。`,'黄色い点 を じゅんに むすぶと できあがり だよ。']}
function makeDraw(r,type){const it={kind:'draw'};
  if(type==='tri2'||type==='quad'||type==='half'){
    const org=type==='tri2'?r.pick(DTRI):type==='quad'?r.pick(DQUAD):r.pick(DHALF);
    const k=type==='tri2'?2:type==='half'?0.5:(org===DQUAD[0]?r.pick([2,3]):2);const pf=placeFree(org,k);
    Object.assign(it,{org:pf.o,k,mode:'free',start:pf.start,names:NB(org.length)});
    it.q=`${FN(org.length,it.names)} の ${kTxt(k)} を かきましょう`;it.say='どこ に かいても いいよ。向き は もとの図 と 同じ に してね。'}
  else if(type==='anchor'){const org=r.pick(DTRI.concat(DQUAD)),k=2,pf=placeFree(org,k);
    Object.assign(it,{org:pf.o,k,mode:'anchor',v:0,names:NB(org.length)});it.at=[pf.o[0][0]*k+pf.start[0],pf.o[0][1]*k+pf.start[1]];it.atName=NT(org.length)[0];
    it.q=`頂点A に 対応する 頂点${it.atName} から、2倍の拡大図 を かこう`;it.say=`ピンク の 点 が 頂点${it.atName} だよ。`}
  else{// 1つの点を中心に
    const opt=r.pick([
      {org:[[2,11],[2,15],[5,15]],c:[2,15],k:2,cn:'頂点B'},
      {org:[[3,9],[3,15],[7,15]],c:[3,15],k:2,cn:'頂点B'},
      {org:[[4,10],[4,14],[9,14]],c:[2,16],k:2,cn:'点O'},
      {org:[[2,4],[2,16],[10,16]],c:[2,16],k:0.5,cn:'頂点B'},
      {org:[[9,4],[9,14],[15,14]],c:[1,16],k:0.5,cn:'点O'},
      {org:[[6,10],[9,10],[9,13],[6,13]],c:[3,16],k:2,cn:'点O'}]);
    Object.assign(it,{org:opt.org,k:opt.k,mode:'center',center:opt.c,names:NB(opt.org.length)});
    it.q=`点O を 中心に して、${kTxt(opt.k)} を かこう`;it.say=`点O は ${opt.cn==='頂点B'?'頂点B と 同じ 場所':'図の 外'} に あるよ。`;
    it.hints=[`O から 頂点 まで の 長さ を ${G.kname(opt.k)}倍 に しよう。ピンク の 線 を 見てね。`,'黄色い点 を じゅんに むすぶと できあがり だよ。'];return it}

 {id:'l5',title:'方眼 を つかって かく',sub:'マス を 数えて かく',slides:[

   scene(c){const org=[[1,4],[4,4],[5,7],[1,7]],T=org.map(([x,y])=>[x*2+3,y*2-6]),nm=['A','B','C','D'];let st=0;const C=26,OX=46,OY=24;

     const draw=()=>{c.clear();const sv=c.svg;gridSvg(sv,30,17,C,OX,OY);el('polygon',{points:org.map(p=>(OX+p[0]*C)+','+(OY+p[1]*C)).join(' '),fill:'#ddf0ff',stroke:'#5d9fd8','stroke-width':3},sv);
       org.forEach((p,i)=>txt(sv,OX+p[0]*C+(i===1||i===2?14:-14),OY+p[1]*C+(i<2?-12:14),nm[i],18,'#4d4270','middle',900));
       const n=Math.min(st,4);for(let i=0;i<n;i++){el('circle',{cx:OX+T[i][0]*C,cy:OY+T[i][1]*C,r:7,fill:'#e46f9f'},sv);txt(sv,OX+T[i][0]*C+(i===1||i===2?16:-16),OY+T[i][1]*C+(i<2?-12:14),'EFGH'[i],18,'#e46f9f','middle',900)}
       for(let i=1;i<n;i++)el('line',{x1:OX+T[i-1][0]*C,y1:OY+T[i-1][1]*C,x2:OX+T[i][0]*C,y2:OY+T[i][1]*C,stroke:'#7a63d6','stroke-width':4},sv);
       if(st>=5)el('line',{x1:OX+T[3][0]*C,y1:OY+T[3][1]*C,x2:OX+T[0][0]*C,y2:OY+T[0][1]*C,stroke:'#7a63d6','stroke-width':4},sv)};
     draw();c.btn({t:'つぎ の 点',x:20,y:300,w:136,c:'sky',on:()=>{if(st<5)st++;draw();c.say(msg[st-1],st===5?'jump':'')}});c.btn({t:'はじめから',x:176,y:300,w:136,c:'white',on:()=>{st=0;draw();c.say('もう一度 やって みよう。')}})}},
  {t:'縮図 も 同じ',say:'1/2の縮図 は、マスの数 を 半分 に するよ。',point:'<span class="h">ポイント</span>1/2の縮図 は、横 と たて の マスの数 を <b>半分</b> に する。',
   scene(c){const sv=c.svg,C=26,OX=46,OY=24,o=[[1,2],[9,2],[9,8],[1,8]],t=[[14,6],[18,6],[18,9],[14,9]];gridSvg(sv,30,17,C,OX,OY);
     [[o,'#ddf0ff','#5d9fd8'],[t,'#ffe3ee','#e46f9f']].forEach(([p,f,s])=>el('polygon',{points:p.map(q=>(OX+q[0]*C)+','+(OY+q[1]*C)).join(' '),fill:f,stroke:s,'stroke-width':3},sv));
     txt(sv,OX+5*C,OY+1.3*C,'横 8マス',18,'#5d9fd8','middle',900);txt(sv,OX+16*C,OY+5.3*C,'横 4マス',18,'#e46f9f','middle',900);
     txt(sv,OX+5*C,OY+10*C,'もとの図',20,'#8a7aa8');txt(sv,OX+16*C,OY+11*C,'1/2の縮図',20,'#e46f9f','middle',900)}}],

 {id:'l6',title:'三角形 の かき方',sub:'3つ の かき方',slides:[0,1,2].map(mi=>({t:['3つ の 辺 を つかう','2つ の 辺 と その間 の 角','1つ の 辺 と 両はし の 角'][mi],

   scene(c){let st=0;const steps=[['辺BC を 2倍 の 6cm ひく。','B から 半径 4cm の 円 を かく。','C から 半径 5cm の 円 を かく。','まじわった 点 が 頂点A。','むすんで できあがり！'],

     ['辺BC を 2倍 の 6cm ひく。','角B（56°）を はかって 線 を ひく。','角C（41°）を はかって 線 を ひく。','まじわった 点 が 頂点A。できあがり！']][mi];
     const s=34,Bx=330,By=400,P=([x,y])=>[Bx+x*s*2,By+y*s*2],A=P(tri456[0]),B=P(tri456[1]),Cc=P(tri456[2]);
     const draw=()=>{c.clear();const sv=c.svg;G.draw(sv,tri456,{s:30,cx:140,cy:300,fill:'#fff',side:1,angle:[1,2],names:['A','B','C'],fs:15});txt(sv,140,450,'もとの図',20,'#8a7aa8');
       const L=(a,b,col,w,da)=>el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:col||'#7a63d6','stroke-width':w||4,'stroke-dasharray':da||'none','stroke-linecap':'round'},sv);
       const dot=(p,t)=>{el('circle',{cx:p[0],cy:p[1],r:6,fill:'#4d4270'},sv);if(t)txt(sv,p[0]+(t==='A'?0:t==='B'?-16:16),p[1]+(t==='A'?-20:18),t,20,'#4d4270','middle',900)};
       if(st>=1){L(B,Cc);dot(B,'B');dot(Cc,'C');txt(sv,(B[0]+Cc[0])/2,By+28,'6cm',18,'#4d4270')}
       const arc=(o,rad,a1,a2)=>{const p1=[o[0]+rad*Math.cos(a1),o[1]+rad*Math.sin(a1)],p2=[o[0]+rad*Math.cos(a2),o[1]+rad*Math.sin(a2)];el('path',{d:`M${p1[0]} ${p1[1]} A${rad} ${rad} 0 0 1 ${p2[0]} ${p2[1]}`,fill:'none',stroke:'#ff92bf','stroke-width':3},sv)};
       const angB=Math.atan2(A[1]-B[1],A[0]-B[0]),angC=Math.atan2(A[1]-Cc[1],A[0]-Cc[0]);
       if(mi===0){if(st>=2)arc(B,4*s,angB-0.25,angB+0.25);if(st>=3)arc(Cc,5*s,angC-0.2,angC+0.2);if(st>=4)dot(A,'A');if(st>=5){L(A,B);L(A,Cc)}}
       if(mi===1){if(st>=2){el('path',{d:`M${B[0]+60} ${B[1]} A60 60 0 0 0 ${B[0]-60} ${B[1]}`,fill:'rgba(159,211,255,.25)',stroke:'#5d9fd8','stroke-width':2},sv);L(B,[B[0]+Math.cos(angB)*200,B[1]+Math.sin(angB)*200],'#b9a6f2',3,'8 6');txt(sv,B[0]+34,B[1]-16,'56°',16,'#8270cf')}
         if(st>=3){L(B,A);dot(A,'A')}if(st>=4)L(A,Cc)}
       if(mi===2){if(st>=2){L(B,[B[0]+Math.cos(angB)*260,B[1]+Math.sin(angB)*260],'#b9a6f2',3,'8 6');txt(sv,B[0]+34,B[1]-16,'56°',16,'#8270cf')}
         if(st>=3){L(Cc,[Cc[0]+Math.cos(angC)*300,Cc[1]+Math.sin(angC)*300],'#b9a6f2',3,'8 6');txt(sv,Cc[0]-40,Cc[1]-14,'41°',16,'#8270cf')}if(st>=4){dot(A,'A');L(A,B);L(A,Cc)}}};
     draw();c.btn({t:'つぎ の 手じゅん',x:20,y:300,w:292,c:'sky',on:()=>{if(st<steps.length)st++;draw();c.say(steps[st-1],st===steps.length?'jump':'')}});
     c.btn({t:'はじめから',x:20,y:366,w:292,c:'white',z:'S',on:()=>{st=0;draw();c.say('はじめ から やって みよう。')}})}})),
